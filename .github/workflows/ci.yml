# Stenny on macOS and Windows, in English and German. Two tiers, one branch (main):
# - quick, on every pull request and push to main: the engine's tests (tests/test_i18n.py keeps English and German
#   complete), the engine bundled for the app and tried, and the app type-checked and compiled;
# - full, on a release tag (v*), on every push to main and by hand (Actions ▸ CI ▸ Run workflow): the quick tier plus
#   the installers built on both systems (installers job below). On main only to keep their build cache warm, so a
#   release tag's installers reuse the compiled dependencies instead of building everything from scratch.
# The Windows runners are how Windows gets tested at all (see #2); what they can't cover (microphone, GPU) is said in
# each PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the app bundles its own ffmpeg (app/build-ffmpeg.sh); the tests use whatever is on the PATH
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      # Chocolatey is on the runner; setup-ffmpeg asked GitHub's API for the latest release and failed whenever
      # that didn't answer ("Cannot get latest release"), which kept main red
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install
        run: uv sync --locked --group dev
      - name: Tests
        run: uv run pytest -q
      # the install and uninstall lines users paste: at least they parse (zsh -n on a Mac, PowerShell's parser on
      # Windows, in Windows PowerShell 5.1 like `irm | iex`)
      - name: Install scripts parse (macOS)
        if: runner.os == 'macOS'
        run: for f in scripts/install.sh scripts/uninstall.sh; do zsh -n "$f"; done
      - name: Install scripts parse (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in 'scripts\install.ps1', 'scripts\uninstall.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host "${f}: $_" }; $bad = 1 }
          }
          exit $bad

  # stenny-rec.exe, the Windows microphone recorder (desktop/stenny-rec, WASAPI). Its tests (the command line, the
  # conversion to 16 kHz mono, the device details) run on both systems; on Windows it is also built and asked about
  # the runner's audio devices. The runner has no microphone: recording itself is tested on a real PC (#2).
  recorder:
    name: Recorder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop/stenny-rec
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/stenny-rec
      - name: Tests
        run: cargo test --locked
      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Devices and errors (no microphone on the runner)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rec=target/release/stenny-rec.exe
          "$rec" --list
          "$rec" --list-json | tee devices.json
          python -c "import json; d = json.load(open('devices.json', encoding='utf-8')); assert isinstance(d, list), d"
          # a microphone that isn't there: exit 1 and say so, like the Swift recorder
          set +e; "$rec" --out test.pcm --device "No such microphone" 2> error.txt < /dev/null; code=$?; set -e
          cat error.txt
          [[ $code == 1 ]] && grep -q "stenny-rec: error:" error.txt
          set +e; "$rec" --loud 2> /dev/null; code=$?; set -e
          [[ $code == 1 ]]

  # The engine inside the app (#92, desktop/scripts/bundle-engine.sh): a standalone Python with Stenny and its locked
  # packages, bundled on both systems and tried the way the app and Claude use it. On Windows it also transcribes a few
  # spoken sentences with faster-whisper's tiny model (the runner has no GPU and the full model is 1.6 GB); the Mac
  # runner has no Metal for mlx, so that is tried on a real Mac. Nothing may be written into the engine's folder.
  bundle:
    name: Engine bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bundle
        shell: bash
        run: desktop/scripts/bundle-engine.sh
      - name: It answers the app and Claude
        shell: bash
        working-directory: desktop/src-tauri/engine
        run: |
          py=bin/python3; [[ -f python.exe ]] && py=./python.exe
          export STENNY_HOME="$RUNNER_TEMP/stenny-home" PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1
          "$py" -m stenny init --folder "$RUNNER_TEMP/stenny-folder"
          "$py" -m stenny course add "Test" -l en
          echo '{"id": 1, "method": "library", "params": {}}' | "$py" -m stenny app-server | tee app-server.json
          grep -q '"id": 1, "result"' app-server.json
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          (echo "$init"; sleep 10) | "$py" -m stenny mcp | tee mcp.json
          grep -q '"serverInfo"' mcp.json
          rm app-server.json mcp.json
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Some speech to transcribe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\talk.wav")
          $voice.Speak("Today we talk about the second law of thermodynamics. Entropy in a closed system never decreases.")
          $voice.Dispose()
      - name: A transcription (Windows, tiny model)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          py=desktop/src-tauri/engine/python.exe
          export STENNY_HOME="$RUNNER_TEMP/stenny-home" PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1
          sed -i 's|^model = "mlx-community/whisper-large-v3-turbo"|model = "tiny"|' "$STENNY_HOME/config.toml"
          "$py" -m stenny add "$RUNNER_TEMP/talk.wav" --course Test --no-llm --now
          grep -ril "entropy" "$RUNNER_TEMP/stenny-folder/Test"
      - name: Nothing was written into the engine
        shell: bash
        working-directory: desktop/src-tauri/engine
        run: |
          find . -type f -newer stenny-engine.json | tee "$RUNNER_TEMP/written.txt"
          [[ ! -s "$RUNNER_TEMP/written.txt" ]]

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target.noindex
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build the interface
        run: npm run build
      # The bundle's helpers (stenny-agent, stenny-rec, ffmpeg), the engine and the connector are built by their own scripts
      # (scripts/helpers.sh, connector/build.sh on a Mac; scripts/ffmpeg-windows.sh, connector/build.sh and
      # scripts/stenny-rec.sh on Windows, the recorder checked in its own job). Compiling only needs the files to exist.
      # stenny-agent is macOS's only (tauri.macos.conf.json); on Windows the app does its work itself.
      - name: Placeholders for the bundled helpers
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          agent=""; [[ "$triple" == *apple* ]] && agent="stenny-agent"
          mkdir -p src-tauri/binaries src-tauri/resources src-tauri/engine
          for b in $agent stenny-rec ffmpeg ffprobe; do touch "src-tauri/binaries/$b-$triple$ext"; done
          touch src-tauri/resources/Stenny.mcpb src-tauri/resources/ffmpeg-license.txt
          # the engine (scripts/bundle-engine.sh, tried in the bundle job): without stenny-engine.json the app ignores it
          touch src-tauri/engine/placeholder.txt
      - name: Compile
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets

  # Full tier only. Builds the installers (macOS: .app + .dmg, Windows: .msi + setup .exe) to prove bundling works on
  # both systems; they are kept as the run's artifacts for a week, unsigned, NOT for handing out. Both carry the real
  # engine (scripts/bundle-engine.sh). On the Mac the Swift
  # helpers and the connector are the real ones (scripts/helpers.sh); ffmpeg/ffprobe are placeholders (the LGPL build,
  # app/build-ffmpeg.sh, takes too long here). On Windows ffmpeg/ffprobe (a pinned LGPL build, scripts/ffmpeg-windows.sh),
  # the connector (connector/build.sh) and stenny-rec (scripts/stenny-rec.sh) are the real ones; stenny-agent is macOS's
  # only (on Windows the app does its work itself).
  installers:
    name: Installer (${{ matrix.os }})
    # Every push (main and release tags), not pull requests: on main it fills the release build's cache (rust-cache
    # saves it per job; a tag's run reads main's), which takes several minutes off a release's Windows setup program.
    # No `needs`: it starts at once instead of waiting for the quick checks, which a merged PR has already passed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # a release tag: the Windows setup program goes onto the release (scripts/install.ps1 needs it)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target.noindex
            desktop/stenny-rec
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: npm ci
      - name: The engine inside the app
        shell: bash
        run: scripts/bundle-engine.sh
      - name: Helpers (macOS)
        if: runner.os == 'macOS'
        run: scripts/helpers.sh
      - name: ffmpeg and the connector (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash scripts/ffmpeg-windows.sh "$(rustc -vV | sed -n 's/^host: //p')"
          bash ../connector/build.sh
          mkdir -p src-tauri/resources && cp ../dist/Stenny.mcpb src-tauri/resources/Stenny.mcpb
      - name: Recorder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/stenny-rec.sh
      - name: Placeholders for the helpers that can't be built here
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          agent=""; [[ "$triple" == *apple* ]] && agent="stenny-agent"
          mkdir -p src-tauri/binaries src-tauri/resources
          for b in $agent stenny-rec ffmpeg ffprobe; do
            f="src-tauri/binaries/$b-$triple$ext"; [[ -e "$f" ]] || touch "$f"
          done
          [[ -e src-tauri/resources/Stenny.mcpb ]] || touch src-tauri/resources/Stenny.mcpb
          [[ -e src-tauri/resources/ffmpeg-license.txt ]] || touch src-tauri/resources/ffmpeg-license.txt
      # Windows: the setup program also signed with the updater's key (Check for Updates…, src-tauri/src/updater.rs;
      # its .sig goes into latest.json below). The Mac's update is made by app/release.sh from the app signed with
      # "Stenny Dev", which CI doesn't have.
      - name: Build the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            npm run tauri build -- --config '{"bundle": {"createUpdaterArtifacts": true}}'
            ls src-tauri/target.noindex/release/bundle/nsis/*-setup.exe.sig
          else
            npm run tauri build
          fi
      - name: Sizes
        shell: bash
        run: |
          cd src-tauri/target.noindex/release/bundle
          du -sh macos/Stenny.app 2>/dev/null || true
          ls -l dmg/*.dmg msi/*.msi nsis/*.exe 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: stenny-${{ runner.os }}-unsigned
          retention-days: 7
          path: |
            desktop/src-tauri/target.noindex/release/bundle/dmg/*.dmg
            desktop/src-tauri/target.noindex/release/bundle/msi/*.msi
            desktop/src-tauri/target.noindex/release/bundle/nsis/*.exe
      # app/release.sh creates the release right after pushing the tag, so wait for it a little. Unsigned, like the
      # artifact; install.ps1 downloads it with PowerShell, so Windows doesn't block it. The Mac app is in Stenny.zip.
      # Then Windows goes into the release's latest.json (release.sh wrote it with the Mac's update), so Windows'
      # Check for Updates… finds it; until then it falls back to the install line (updater.rs).
      - name: Attach the Windows setup program to the release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 20); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          setup="$(ls src-tauri/target.noindex/release/bundle/nsis/*-setup.exe)"
          gh release upload "$GITHUB_REF_NAME" "$setup" --clobber
          gh release download "$GITHUB_REF_NAME" -p latest.json -D "$RUNNER_TEMP" --clobber \
            || echo "No latest.json on the release yet: starting one with Windows only"
          python scripts/latest-json.py "$RUNNER_TEMP/latest.json" --version "$GITHUB_REF_NAME" \
            --platform windows-x86_64 --signature-file "$setup.sig" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$setup")"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
