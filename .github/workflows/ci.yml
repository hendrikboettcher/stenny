# Stenny on macOS and Windows, in English and German. Two tiers, one branch (main):
# - quick, on every pull request and push to main: the engine's tests (tests/test_i18n.py keeps English and German
#   complete) and the app type-checked and compiled;
# - full, on a release tag (v*) or by hand (Actions ▸ CI ▸ Run workflow): the quick tier plus the installers built
#   on both systems (installers job below).
# The Windows runners are how Windows gets tested at all (see #2); what they can't cover (microphone, GPU) is said in
# each PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the app bundles its own ffmpeg (app/build-ffmpeg.sh); the tests use whatever is on the PATH
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      # Chocolatey is on the runner; setup-ffmpeg asked GitHub's API for the latest release and failed whenever
      # that didn't answer ("Cannot get latest release"), which kept main red
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install
        run: uv sync --locked --group dev
      - name: Tests
        run: uv run pytest -q

  # stenny-rec.exe, the Windows microphone recorder (desktop/stenny-rec, WASAPI). Its tests (the command line, the
  # conversion to 16 kHz mono, the device details) run on both systems; on Windows it is also built and asked about
  # the runner's audio devices. The runner has no microphone: recording itself is tested on a real PC (#2).
  recorder:
    name: Recorder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop/stenny-rec
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/stenny-rec
      - name: Tests
        run: cargo test --locked
      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Devices and errors (no microphone on the runner)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rec=target/release/stenny-rec.exe
          "$rec" --list
          "$rec" --list-json | tee devices.json
          python -c "import json; d = json.load(open('devices.json', encoding='utf-8')); assert isinstance(d, list), d"
          # a microphone that isn't there: exit 1 and say so, like the Swift recorder
          set +e; "$rec" --out test.pcm --device "No such microphone" 2> error.txt < /dev/null; code=$?; set -e
          cat error.txt
          [[ $code == 1 ]] && grep -q "stenny-rec: error:" error.txt
          set +e; "$rec" --loud 2> /dev/null; code=$?; set -e
          [[ $code == 1 ]]

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target.noindex
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build the interface
        run: npm run build
      # The bundle's helpers (stenny-agent, stenny-rec, ffmpeg) and the connector are built by their own scripts
      # (scripts/helpers.sh, connector/build.sh on a Mac; scripts/ffmpeg-windows.sh, connector/build.sh and
      # scripts/stenny-rec.sh on Windows, the recorder checked in its own job). Compiling only needs the files to exist.
      # stenny-agent is macOS's only (tauri.macos.conf.json); on Windows the app does its work itself.
      - name: Placeholders for the bundled helpers
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          agent=""; [[ "$triple" == *apple* ]] && agent="stenny-agent"
          mkdir -p src-tauri/binaries src-tauri/resources
          for b in $agent stenny-rec ffmpeg ffprobe; do touch "src-tauri/binaries/$b-$triple$ext"; done
          touch src-tauri/resources/Stenny.mcpb src-tauri/resources/ffmpeg-license.txt
      - name: Compile
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets

  # Full tier only. Builds the installers (macOS: .app + .dmg, Windows: .msi + setup .exe) to prove bundling works on
  # both systems; they are kept as the run's artifacts for a week, unsigned, NOT for handing out. On the Mac the Swift
  # helpers and the connector are the real ones (scripts/helpers.sh); ffmpeg/ffprobe are placeholders (the LGPL build,
  # app/build-ffmpeg.sh, takes too long here). On Windows ffmpeg/ffprobe (a pinned LGPL build, scripts/ffmpeg-windows.sh),
  # the connector (connector/build.sh) and stenny-rec (scripts/stenny-rec.sh) are the real ones; stenny-agent is macOS's
  # only (on Windows the app does its work itself).
  installers:
    name: Installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: app  # not engine: a failing engine test shouldn't hide whether the installers build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target.noindex
            desktop/stenny-rec
      - name: Install
        run: npm ci
      - name: Helpers (macOS)
        if: runner.os == 'macOS'
        run: scripts/helpers.sh
      - name: ffmpeg and the connector (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash scripts/ffmpeg-windows.sh "$(rustc -vV | sed -n 's/^host: //p')"
          bash ../connector/build.sh
          mkdir -p src-tauri/resources && cp ../dist/Stenny.mcpb src-tauri/resources/Stenny.mcpb
      - name: Recorder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/stenny-rec.sh
      - name: Placeholders for the helpers that can't be built here
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          agent=""; [[ "$triple" == *apple* ]] && agent="stenny-agent"
          mkdir -p src-tauri/binaries src-tauri/resources
          for b in $agent stenny-rec ffmpeg ffprobe; do
            f="src-tauri/binaries/$b-$triple$ext"; [[ -e "$f" ]] || touch "$f"
          done
          [[ -e src-tauri/resources/Stenny.mcpb ]] || touch src-tauri/resources/Stenny.mcpb
          [[ -e src-tauri/resources/ffmpeg-license.txt ]] || touch src-tauri/resources/ffmpeg-license.txt
      - name: Build the installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: stenny-${{ runner.os }}-unsigned
          retention-days: 7
          path: |
            desktop/src-tauri/target.noindex/release/bundle/dmg/*.dmg
            desktop/src-tauri/target.noindex/release/bundle/msi/*.msi
            desktop/src-tauri/target.noindex/release/bundle/nsis/*.exe
