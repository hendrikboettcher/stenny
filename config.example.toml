# Stenny configuration. `stenny init [--folder <folder>]` copies it to Stenny's config place: on a Mac
# ~/Library/Application Support/Stenny/config.toml, on Windows %APPDATA%\Stenny\config.toml (`stenny where`).
# Paths may use ~. Nothing personal is hardcoded in the code; everything lives here.

folder = "~/Documents/Stenny"                # everything you or Claude read: courses, Talks, glossaries, course
                                             # files, topics. A folder in an Obsidian vault works too. Stenny
                                             # never writes anywhere else.
# data_dir = "/Volumes/Disk/Stenny"          # where Recordings/ goes (audio, segments.json, raw output); default:
                                             # Stenny's own app-data folder, see `stenny where`
keep_audio = true                            # false = don't archive audio (the original file is never deleted)

[transcription]
model = "mlx-community/whisper-large-v3-turbo"   # on Windows the same model through faster-whisper ("large-v3-turbo")
# engine = "auto"   # auto: mlx-whisper on a Mac (Metal), faster-whisper on Windows (an NVIDIA GPU, else the CPU);
                    # "mlx" or "faster-whisper" to pick one, e.g. to compare them on a Mac

[llm]
backend = "claude-code"      # claude-code (subscription, `claude -p`) | api (Anthropic API key) | none
# the API key is never in this file: Settings ▸ Transcripts & AI or `stenny api-key` keep it in the system keychain
model = "claude-haiku-5-5"   # model for claude-code
api_model = "claude-haiku-5-5"
summary = true               # write the AI summary (… (summary).md)

[processing]
priority = "low"             # normal | low (nice + utility QoS; Windows: below normal) | background (heavily throttled)
require_ac_for_queue = true  # queued jobs (`stenny add --later`) wait for AC power
night_only = false           # true = queued jobs run only between night_start and night_end
night_start = "01:00"
night_end = "07:00"

[app]
# Stenny's pause/resume shortcut, from anywhere. Modifiers: cmd, shift, ctrl, opt; then one key as printed
# on your keyboard (or space, f1–f20). The default suits German keyboards (Ü is right of P); on other
# keyboards pick something else, e.g. "cmd+shift+p" or "ctrl+opt+space". Stenny's Settings window sets it too.
pause_shortcut = "cmd+shift+ü"
# The language of Stenny's windows, menus and notifications: "system" (the first of the system's preferred
# languages that Stenny has, else English), "en" or "de". Settings ▸ General sets it too. Transcripts keep the
# language of their course.
language = "system"
# The "Finish setting up Stenny" card in the library window, until your courses, the AI step, the connector for
# Claude and the calendar are set up. Stenny sets this to false once they are (or when you choose "Don't show this
# again").
# setup_checklist = true
# "Record this lecture?" 10 minutes before a lecture in your calendar starts (Settings ▸ Calendar). false: no
# notification; the lecture is still offered at the top of Stenny's menu. Calendar links pasted in Settings are not
# kept here but in the Keychain (Windows: Credential Manager).
# reminders = true

[live]
# device = "MacBook Air Microphone"   # microphone for `stenny live` (see `stenny devices`);
                                       # unset = the system's input device. Stenny has its own picker.
# draft = true        # live draft, plugged in or on battery (paused below 20 % battery); false: record only, the transcript is made after the lecture
# backup = "auto"   # second microphone recorded alongside, used only where the main one sent nothing
                    # (e.g. while you use the iPhone): "auto" = the computer's own microphone, "off", or a name

# Talks and events (Stenny: Start Lecture ▸ Other…, or `stenny live --event "Title"`): not courses.
# They go to the Talks folder inside the Stenny folder (so a course can't be called "Talks").
# [recordings]
# languages = ["en", "de", "fr"]           # detected among these, about every 25 s

# Only for developers: the Claude extension (Stenny.mcpb) normally runs the installed `stenny`; this runs
# another copy instead, e.g. a development checkout. Turn the extension off and on in Claude after a change.
# [connector]
# stenny = "~/Code/stenny/.venv/bin/stenny"

# One table per course. language: a fixed code ("fr", "de", "en", …), "auto" (one language per lecture,
# detected among `languages`) or "mixed" (detected per 4-12 s chunk among `languages`).
# aliases: short names for the command line (`--course calc`); calendar: extra words that identify the
# course in calendar event titles; hidden = true takes it out of the menu and calendar matching (Stenny's
# Hide Course does that, nothing is deleted). Replace these examples with your own courses.
[courses."Calculus"]
language = "en"
tags = ["maths"]
aliases = ["calc"]

[courses."International Economics"]
language = "mixed"
languages = ["fr", "en", "de"]
tags = ["economics"]
aliases = ["ie"]
