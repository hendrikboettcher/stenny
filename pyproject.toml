[project]
name = "stenny"
version = "0.4.0"
description = "Stenny: transcribe lectures locally with Whisper into clean Markdown in an Obsidian vault"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "faster-whisper>=1.1 ; sys_platform != 'darwin'",  # Windows' engine (CTranslate2: CPU, or an NVIDIA GPU)
    "keyring>=25 ; sys_platform != 'darwin'",
    "mcp>=2.3",
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",  # Apple Silicon (Metal); Windows gets its own engine (#2)
    "numpy>=2",
    "pypdf>=6.21.1",
]

[project.optional-dependencies]
# the Anthropic API is always included now; kept so older `uv tool install -e '.[api]'` commands still work
api = []

[project.scripts]
stenny = "stenny.cli:main"
# the old name, kept for a while so existing scripts and habits keep working
lecture = "stenny.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
