[package]
name = "stenny-desktop"
version = "0.1.0"
description = "Stenny: lectures, transcribed on your Mac"
authors = ["Stenny"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stenny_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
sys-locale = "0.3"  # the system's preferred languages, for "System default" (src/i18n.rs)

# the menu bar's native details Tauri doesn't expose (src/macos.rs); same versions as tray-icon's
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3.2", features = ["NSMenu", "NSMenuItem", "NSEvent", "NSFont", "NSFontDescriptor", "NSControl", "NSButton", "NSStatusItem", "NSStatusBarButton", "NSView", "NSResponder", "objc2-core-foundation"] }

# Windows: Share… through the system's Share panel (src/windows_share.rs); what stenny-agent does on a Mac — the pause
# shortcut, open at login, the beep, the clipboard, the lecture notification (src/windows_agent.rs) and the PDF for Share… (src/windows_pdf.rs,
# WebView2's own PrintToPdf) — with the windows and webview2-com versions Tauri already uses; one Stenny at a time
# through Tauri's single-instance plugin (a second start brings the running one's library window up)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "UI_Notifications"] }
windows-collections = "0.3"
tauri-winrt-notification = "0.8"  # "Record this lecture?" with its Start Recording button; the notification plugin's own
webview2-com = "0.39"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
