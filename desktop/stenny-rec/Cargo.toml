# stenny-rec.exe, Stenny's microphone recorder on Windows (WASAPI); see src/main.rs. On macOS the recorder is the
# Swift one in app/Sources/stenny-rec; this crate still builds there (a stub) so its tests run on both.
[package]
name = "stenny-rec"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
